name: tests
on: [push, pull_request]
jobs:
  plugin-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install yq (v4, mikefarah)
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          yq --version
      - name: Run every plugin suite (plugins/*/tests/run.sh)
        run: |
          set -e; found=0
          for t in plugins/*/tests/run.sh; do
            [ -f "$t" ] || continue
            found=1
            echo "::group::$t"
            bash "$t"
            echo "::endgroup::"
          done
          if [ "$found" -eq 0 ]; then echo "no plugin suites found"; exit 1; fi
  validate-plugins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code
      - name: Validate marketplace and all plugins (strict)
        run: bash scripts/validate-plugins.sh
  library-wiring:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Symlinks resolve (library-view wiring, ADR-0036)
        run: |
          broken=$(find plugins -type l ! -exec test -e {} \; -print)
          if [ -n "$broken" ]; then
            echo "Dangling symlinks (skills ship as empty components):"
            echo "$broken"
            exit 1
          fi
          echo "All plugin symlinks resolve."
      - name: No file symlinks (discovery skips them, ADR-0036)
        run: |
          filelinks=$(find plugins -type l -xtype f -print)
          if [ -n "$filelinks" ]; then
            echo "Symlinked files are invisible to component discovery; symlink directories instead:"
            echo "$filelinks"
            exit 1
          fi
          echo "No file symlinks."
