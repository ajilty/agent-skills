name: Claude Code Review

on:
  pull_request:
    # No `synchronize`: a review costs real money (~$6/run), so pushes to an
    # open PR don't re-review. Comment `@claude review` for a fresh pass.
    types: [opened, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Same-repo PRs only. Fork PRs get no secrets, so the action would burn a
    # runner without ever authenticating; skipping is explicit and legible.
    # (Public repo: forks are the only outside vector — branch PRs need push.)
    if: github.event.pull_request.head.repo.full_name == github.repository

    runs-on: ubuntu-latest
    permissions:
      contents: read
      # write: Claude posts its review (and inline comments) through the GitHub
      # MCP server. With `read` the run still exits green, having silently had
      # every post denied.
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          # --comment is what posts findings as inline PR comments. Without it
          # the skill returns them as text, and automation mode (track_progress
          # false) creates no comment for that text to land in — so the review
          # runs, costs tokens, and surfaces nowhere.
          prompt: '/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          # Surfaces the review text and any denied tool in the job log, so a
          # silent no-op is diagnosable without paying for a blind re-run.
          show_full_output: true
          # Forces tag mode, which is what wires up the PR-context GitHub tools.
          # Without it, automation mode has no inline-comment tool at all
          # (ToolSearch for mcp__github_inline_comment__create_inline_comment
          # returns zero matches), so findings collapse into one PR comment.
          track_progress: true
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

